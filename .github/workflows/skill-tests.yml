name: Skill tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  skill-launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Exercise native launchers
        run: |
          python skills/markitdown/tests/launcher_smoke.py
          python skills/remote-llm-wiki/tests/launcher_smoke.py

  remote-llm-wiki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and wiki tests
        run: |
          python -m compileall -q skills/remote-llm-wiki/scripts skills/remote-llm-wiki/tests
          python -m unittest discover -s skills/remote-llm-wiki/tests -v

  markitdown:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and MarkItDown tests
        run: |
          python -m compileall -q skills/markitdown/scripts skills/markitdown/tests
          python -m unittest discover -s skills/markitdown/tests -p 'test_*.py' -v
      - name: Install current MarkItDown and integration test dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade 'markitdown[pdf,docx,pptx,xlsx]' reportlab python-docx python-pptx openpyxl
          python -m pip check
          python -m pip show markitdown
      - name: Exercise real document converters
        if: runner.os == 'Linux'
        run: python skills/markitdown/tests/integration_smoke.py

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Repository contract tests
        run: python -m unittest discover -s tests -v

  skill-tests-passed:
    name: Skill tests passed
    needs: [skill-launchers, remote-llm-wiki, markitdown, regressions]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful test jobs
        env:
          ALL_TESTS_PASSED: >-
            ${{ needs.skill-launchers.result == 'success'
                && needs.remote-llm-wiki.result == 'success'
                && needs.markitdown.result == 'success'
                && needs.regressions.result == 'success' }}
        run: test "$ALL_TESTS_PASSED" = true

name: Skill tests

on:
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-llm-wiki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and wiki tests
        run: |
          python -m compileall -q skills/remote-llm-wiki/scripts skills/remote-llm-wiki/tests
          python -m unittest discover -s skills/remote-llm-wiki/tests -v

  markitdown:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and MarkItDown tests
        run: |
          python -m compileall -q skills/markitdown/scripts skills/markitdown/tests
          python -m unittest discover -s skills/markitdown/tests -p 'test_*.py' -v
      - name: Install pinned integration dependencies
        run: |
          python -m pip install 'markitdown[pdf,docx,pptx,xlsx]==0.1.9' reportlab python-docx python-pptx openpyxl
          python -m pip check
      - name: Exercise real document converters
        run: python skills/markitdown/tests/integration_smoke.py

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Cross-skill regression tests
        run: python -m unittest discover -s tests -v

name: Skill tests

on:
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
      - 'docs/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-llm-wiki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and wiki tests
        run: |
          python -m compileall -q skills/remote-llm-wiki/scripts skills/remote-llm-wiki/tests
          python -m unittest discover -s skills/remote-llm-wiki/tests -v

  markitdown:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline syntax and MarkItDown tests
        run: |
          python -m compileall -q skills/markitdown/scripts skills/markitdown/tests
          python -m unittest discover -s skills/markitdown/tests -p 'test_*.py' -v
      - name: Install current MarkItDown and integration test dependencies
        run: |
          python -m pip install --upgrade 'markitdown[pdf,docx,pptx,xlsx]' reportlab python-docx python-pptx openpyxl
          python -m pip check
          python -m pip show markitdown
      - name: Exercise real document converters
        run: python skills/markitdown/tests/integration_smoke.py

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Cross-skill regression tests
        run: python -m unittest discover -s tests -v


  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Agent Plugins manifest and skill metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugin = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          assert plugin['name'] == 'simorex-skills'
          assert plugin['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json'
          for name in ('remote-llm-wiki', 'markitdown'):
              path = Path('skills') / name / 'SKILL.md'
              data = path.read_text(encoding='utf-8')
              assert data.startswith('---\\n'), f'{path}: missing YAML frontmatter'
              assert f'name: {name}\\n' in data.split('---', 2)[1], f'{path}: wrong name'
              assert (path.parent / 'scripts').is_dir(), f'{path}: scripts missing'
          PY
      - name: Discover skills using official skills CLI
        run: |
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list 2>&1 | tee /tmp/skill-discovery.txt
          grep -F 'remote-llm-wiki' /tmp/skill-discovery.txt
          grep -F 'markitdown' /tmp/skill-discovery.txt
      - name: Install both skills in an isolated project
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill '*' --agent github-copilot --yes --copy
          for skill in remote-llm-wiki markitdown; do
            test -s ".agents/skills/$skill/SKILL.md"
            test -d ".agents/skills/$skill/scripts"
          done

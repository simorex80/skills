name: Skill tests

on:
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - '.github/workflows/skill-tests.yml'
      - 'plugin.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-llm-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline syntax and wiki tests
        run: |
          python -m compileall -q skills/remote-llm-wiki/scripts skills/remote-llm-wiki/tests
          python -m unittest discover -s skills/remote-llm-wiki/tests -v

  markitdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline syntax and MarkItDown tests
        run: |
          python -m compileall -q skills/markitdown/scripts skills/markitdown/tests
          python -m unittest discover -s skills/markitdown/tests -v
      - name: Install MarkItDown for integration smoke test
        run: python -m pip install 'markitdown[pdf,docx,pptx,xlsx]==0.1.9'
      - name: Exercise real converter API
        run: |
          mkdir -p demo
          printf '<h1>V2 integration check</h1><p>Document</p>\n' > demo/example.html
          python skills/markitdown/scripts/convert.py extract demo/example.html | grep 'V2 integration check'
          python skills/markitdown/scripts/convert.py convert demo/example.html --output demo/example.md
          grep 'V2 integration check' demo/example.md
          python skills/markitdown/scripts/convert.py batch demo --output-dir batch-output
          grep 'V2 integration check' batch-output/example.md

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cross-skill regression tests
        run: python -m unittest discover -s tests -v

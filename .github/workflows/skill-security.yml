name: Skill security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector:
    name: SkillSpector scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SkillSpector
        run: python -m pip install "git+https://github.com/NVIDIA/SkillSpector.git@v2.13.7"
      - name: Scan distributed skills
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("skills")
          reports = Path(os.environ["RUNNER_TEMP"]) / "skillspector-reports"
          reports.mkdir()
          if root.is_symlink():
              raise SystemExit("The skills directory must not be a symbolic link.")
          manifests = sorted(root.glob("*/SKILL.md"))
          if not manifests:
              raise SystemExit("No distributed skills found under skills/*/SKILL.md.")

          failed = False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## SkillSpector static scan\n\n")
              for index, manifest in enumerate(manifests, start=1):
                  name = html.escape(manifest.parent.name)
                  if manifest.parent.is_symlink() or manifest.is_symlink() or not manifest.is_file():
                      summary.write(f"- <code>{name}</code> · Invalid skill path\n")
                      failed = True
                      continue

                  report = reports / f"skill-{index}.json"
                  log = reports / f"skill-{index}.stderr.txt"
                  with report.open("wb") as output, log.open("wb") as errors:
                      result = subprocess.run(
                          ["skillspector", "scan", str(manifest.parent), "--no-llm",
                           "--fail-on-incomplete", "--format", "json"],
                          stdout=output, stderr=errors, check=False,
                      )

                  try:
                      risk = json.loads(report.read_bytes())["risk_assessment"]
                      score = int(risk["score"])
                      recommendation = html.escape(risk["recommendation"])
                  except (ValueError, KeyError, TypeError, AttributeError):
                      summary.write(f"- <code>{name}</code> · Invalid or missing report "
                                    f"(exit {result.returncode}, {report.name})\n")
                      failed = True
                      continue

                  outcome = {0: "Passed", 1: "Blocked", 2: "Scanner error"}.get(
                      result.returncode, "Scanner error"
                  )
                  summary.write(f"- <code>{name}</code> · {outcome} · {recommendation} "
                                f"({score}/100, {report.name})\n")
                  failed |= result.returncode != 0

          raise SystemExit(1 if failed else 0)
          PY
      - name: Upload SkillSpector reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-reports
          path: ${{ runner.temp }}/skillspector-reports/
          if-no-files-found: ignore
          retention-days: 14

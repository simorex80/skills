name: Skill evaluator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-evaluator:
    name: SkillEvaluator scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SkillEvaluator and static scanners
        run: |
          python -m pip install "skillevaluator[security]==1.2.1" "semgrep==1.187.0" \
            "git+https://github.com/NVIDIA/SkillSpector.git@v2.13.7"
      - name: Validate distributed skills
        env:
          SKILLEVALUATOR_REQUIRE_SEMGREP: '1'
        run: |
          scanner_path="$(command -v skillspector)"
          export SKILLEVALUATOR_SKILLSPECTOR_PATH="$scanner_path"
          python - <<'PY'
          import html
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("skills")
          reports = Path(os.environ["RUNNER_TEMP"]) / "skillevaluator-reports"
          reports.mkdir()
          if root.is_symlink():
              raise SystemExit("The skills directory must not be a symbolic link.")
          manifests = sorted(root.glob("*/SKILL.md"))
          if not manifests:
              raise SystemExit("No distributed skills found under skills/*/SKILL.md.")

          checks = "schema,version,security,pii,license,code-integrity,dependency,unicode,quality,lint,harness"
          failed = False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## SkillEvaluator static validation\n\n")
              for index, manifest in enumerate(manifests, start=1):
                  name = html.escape(manifest.parent.name)
                  if manifest.parent.is_symlink() or manifest.is_symlink() or not manifest.is_file():
                      summary.write(f"- <code>{name}</code> · Invalid skill path\n")
                      failed = True
                      continue

                  output_dir = reports / f"skill-{index}"
                  output_dir.mkdir()
                  with (output_dir / "scan.log").open("wb") as log:
                      result = subprocess.run(
                          ["skillevaluator", "validate", str(manifest.parent), "--type", "skill",
                           "--tiers", "1", "--checks", checks, "--no-llm", "--continue-on-failure",
                           "-r", "json,markdown", "-o", str(output_dir)],
                          stdout=log, stderr=subprocess.STDOUT, check=False,
                      )

                  try:
                      report_path, = output_dir.glob("skillevaluator-output-*.json")
                      report = json.loads(report_path.read_bytes())
                      security, = (item for item in report["results"] if item["validator"] == "Security Scan")
                      validation_passed = report["overall_passed"] is True and security["status"] == "passed"
                      score = security["skillspector_applicability"]["raw_risk_score"]
                      if type(score) is not int or not 0 <= score <= 100:
                          raise ValueError("Invalid raw risk score")
                  except (ValueError, KeyError, TypeError, OSError):
                      summary.write(f"- <code>{name}</code> · Missing or incomplete scanner evidence "
                                    f"(exit {result.returncode}, see `{output_dir.name}/`)\n")
                      failed = True
                      continue

                  # SkillEvaluator can filter findings by file role. Keep the existing raw-score gate.
                  passed = result.returncode == 0 and validation_passed and score <= 50
                  outcome = "Passed" if passed else "Blocked"
                  summary.write(f"- <code>{name}</code> · {outcome} · raw risk {score}/100 "
                                f"(see `{output_dir.name}/`)\n")
                  failed |= not passed

          raise SystemExit(1 if failed else 0)
          PY
      - name: Upload validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: skillevaluator-reports
          path: ${{ runner.temp }}/skillevaluator-reports/
          if-no-files-found: ignore
          retention-days: 14
